<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <title>gurp - Robux Calculator</title>
  <link href="styles.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600;700&display=swap" rel="stylesheet" />
  <link rel="shortcut icon" type="image/x-icon" href="favicon.ico" />
  <meta property="og:title" content="gurp Robux Calculator" />
  <meta property="og:description" content="Estimate game pass sales and payout after Roblox marketplace fee." />
  <meta property="og:type" content="website" />
</head>
<body>
  <header class="site-header">
    <div class="container site-nav">
      <a href="/" class="brand"><img src="logo.png" alt="gurp logo" class="brand-logo" /> gurp</a>
      <nav class="nav-links">
        <a href="https://status.gurp.cc/" class="live-status-chip status-ok" data-live-status>Checking status...</a>
        <a href="/" class="nav-link">Home</a>
        <a href="/features" class="nav-link">Features</a>
        <a href="/cases" class="nav-link active">Calculator</a>
        <a href="/tos" class="nav-link">TOS</a>
      </nav>
    </div>
  </header>

  <main class="section">
    <div class="container">
      <h2>Robux Sales Calculator</h2>
      <p class="section-intro">
        Estimate how many sales you need and what payout remains after the standard Roblox marketplace fee.
      </p>
      <div class="card">
        <div class="calculator-grid">
          <div>
            <label for="passPrice">Game Pass Price (R$)</label>
            <input type="number" id="passPrice" placeholder="e.g. 250" min="0" step="1" />
          </div>
          <div>
            <label for="goalRobux">Target Robux (R$)</label>
            <input type="number" id="goalRobux" placeholder="e.g. 5000" min="0" step="1" />
          </div>
          <div>
            <label for="feePercent">Marketplace Fee (%)</label>
            <input type="number" id="feePercent" placeholder="Default 30" min="0" max="100" step="1" value="30" />
          </div>
        </div>
        <button onclick="calculateRobux()" class="btn btn-primary" type="button">Calculate</button>
        <div class="result" id="result">Sales Needed: 0</div>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <p><span class="footer-brand"><img src="logo.png" alt="gurp logo" /> gurp</span>Roblox tools. <a href="https://discord.gg/UZz5rxRjeM">Join Discord</a></p>
    </div>
  </footer>

  <script>
    function calculateRobux() {
      const passPrice = Number.parseFloat(document.getElementById("passPrice").value) || 0;
      const goalRobux = Number.parseFloat(document.getElementById("goalRobux").value) || 0;
      const feePercent = Number.parseFloat(document.getElementById("feePercent").value);
      const finalFee = Number.isFinite(feePercent) ? feePercent : 30;

      if (passPrice <= 0 || goalRobux <= 0 || finalFee < 0 || finalFee >= 100) {
        document.getElementById("result").innerText = "Enter valid values. Fee must be between 0 and 99.";
        return;
      }

      const payoutPerSale = passPrice * (1 - finalFee / 100);
      const salesNeeded = Math.ceil(goalRobux / payoutPerSale);
      const grossSales = salesNeeded * passPrice;
      const expectedPayout = Math.floor(salesNeeded * payoutPerSale);

      document.getElementById("result").innerText =
        "Sales Needed: " + salesNeeded +
        "\nGross Robux: R$" + grossSales +
        "\nEstimated Payout: R$" + expectedPayout;
    }
  </script>
  <script src="live-status.js" defer></script>
</body>
</html>
