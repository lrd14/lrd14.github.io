    <h1>Case calculators</h1>
</header>

<section class="features">

    <div class="calculator">
    <h2>Case & Key Calculator</h2>

    <div class="feature-grid">
      <div class="feature-card">
    
    <h2>Case Price:</h2>
    <input type="number" id="casePrice" placeholder="Enter case price" step="0.01">

      </div>

    <div class="feature-card">

    <h2>Key Price:</h2>
    <input type="number" id="keyPrice" placeholder="Enter key price" step="0.01">

    </div>

    <div class="feature-card">

    <h2>Budget:</h2>
    <input type="number" id="budget" placeholder="Enter your budget" step="0.01">

    </div>

    </div>

    <a onclick="calculate()" class="btn-glow">Calculate</a>

    <div class="result" id="result">Max Sets: 0</div>
  </div>

  <script>
    function calculate() {
      const casePrice = parseFloat(document.getElementById('casePrice').value) || 0;
      const keyPrice = parseFloat(document.getElementById('keyPrice').value) || 0;
      const budget = parseFloat(document.getElementById('budget').value) || 0;

      const setPrice = casePrice + keyPrice;

      if (setPrice <= 0) {
        document.getElementById('result').innerText = "Case + Key price must be > 0!";
        return;
      }

      const maxSets = Math.floor(budget / setPrice);
      const spent = (maxSets * setPrice).toFixed(2);
      const leftover = (budget - spent).toFixed(2);

      document.getElementById('result').innerText =
        `Max Sets: ${maxSets}\nSpent: $${spent}\nLeftover: $${leftover}`;
    }
  </script>
