# Keeps https://gurp.cc/updates in sync with the release notes on lrd14/miniature-spork
# (tag "consumer"). Every 15 minutes it records any new version, new gurp.gurp upload or
# edited notes into updates.json and commits it, then asks GitHub Pages to republish.
name: Log gurp updates

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: log-updates
  cancel-in-progress: false

jobs:
  log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Record release notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/log_release.py

      - name: Commit and republish if changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- updates.json; then
            echo "No new updates."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add updates.json
          git commit -m "Log gurp update from release notes"
          git push
          # Pushes made with the workflow token don't always start a Pages build on their own.
          gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" || echo "Pages build request failed (the next push will still publish it)"
