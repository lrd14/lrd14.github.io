<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <title>gurp - Download Access</title>
  <meta name="theme-color" content="#97ce5d" />
  <link href="styles.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600;700&display=swap" rel="stylesheet" />
  <link rel="shortcut icon" type="image/x-icon" href="favicon.ico" />
  <meta property="og:title" content="gurp" />
  <meta property="og:description" content="gurp makes Roblox better" />
  <meta property="og:site_name" content="gurp - Download Access" />
  <meta property="og:type" content="website" />
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="container site-nav">
      <a href="/" class="brand"><img src="logo.png" alt="gurp logo" class="brand-logo" /> gurp</a>
      <nav class="nav-links">
        <a href="https://status.gurp.cc/" class="live-status-chip status-ok" data-live-status>Checking status...</a>
        <a href="/" class="nav-link">Home</a>
        <a href="/features" class="nav-link">Features</a>
        <a href="/tos" class="nav-link">TOS</a>
        <a href="/access" class="btn btn-primary" data-account-btn>Login</a>
      </nav>
    </div>
  </header>

  <main class="section">
    <div class="container auth-wrap">
      <div class="card">
        <h2>Download Access</h2>
        <p class="section-intro">Login or register with your gurp account to continue to download.</p>

        <div class="auth-tabs">
          <button type="button" class="btn btn-secondary auth-tab" data-target="loginPanel">Login</button>
          <button type="button" class="btn btn-secondary auth-tab" data-target="registerPanel">Register</button>
        </div>

        <section id="loginPanel" class="auth-panel active" aria-label="Login panel">
          <form id="loginForm" class="form-stack">
            <div>
              <label for="loginUsername">Username</label>
              <input id="loginUsername" name="username" type="text" autocomplete="username" required />
            </div>
            <div>
              <label for="loginPassword">Password</label>
              <input id="loginPassword" name="password" type="password" autocomplete="current-password" required />
            </div>
            <label class="remember-row">
              <input id="loginRemember" name="remember" type="checkbox" checked />
              Keep me logged in
            </label>
            <div id="loginTurnstile"></div>
            <button type="submit" class="btn btn-primary">Login and Download</button>
          </form>
        </section>

        <section id="registerPanel" class="auth-panel" aria-label="Register panel">
          <form id="registerForm" class="form-stack">
            <div>
              <label for="registerUsername">Username</label>
              <input id="registerUsername" name="username" type="text" autocomplete="username" required />
            </div>
            <div>
              <label for="registerPassword">Password</label>
              <input id="registerPassword" name="password" type="password" autocomplete="new-password" required />
            </div>
            <div>
              <label for="registerLicense">License Key</label>
              <input id="registerLicense" name="license" type="text" placeholder="Enter your purchase key" required />
            </div>
            <label class="remember-row">
              <input id="registerRemember" name="remember" type="checkbox" checked />
              Keep me logged in
            </label>
            <div id="registerTurnstile"></div>
            <button type="submit" class="btn btn-primary">Register and Download</button>
          </form>
        </section>

        <div id="status" class="status-text" role="status" aria-live="polite">Ready.</div>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <p><span class="footer-brand"><img src="logo.png" alt="gurp logo" /> gurp</span>Download page</p>
    </div>
  </footer>

  <script>
    const AUTH_ENDPOINT = "https://gurp-keyauth-gateway.lrd14.workers.dev";
    const TURNSTILE_SITE_KEY = "0x4AAAAAADIfjLRkCogM7-dm";
    const DOWNLOAD_PATH = "/download";
    const SESSION_KEY = "gurp_access_session";
    const CATALOG_ORIGIN = "https://catalog.gurp.cc";

    const statusEl = document.getElementById("status");
    const tabs = document.querySelectorAll(".auth-tab");
    const panels = document.querySelectorAll(".auth-panel");
    let loginTurnstileId = null;
    let registerTurnstileId = null;

    function setStatus(message, type) {
      statusEl.textContent = message;
      statusEl.classList.remove("error", "success");
      if (type) {
        statusEl.classList.add(type);
      }
    }

    function activatePanel(targetId) {
      panels.forEach((panel) => {
        panel.classList.toggle("active", panel.id === targetId);
      });
      tabs.forEach((tab) => {
        tab.classList.toggle("btn-primary", tab.dataset.target === targetId);
        tab.classList.toggle("btn-secondary", tab.dataset.target !== targetId);
      });
    }

    async function authRequest(payload) {
      const response = await fetch(AUTH_ENDPOINT, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) {
        throw new Error(data.message || "Auth request failed.");
      }
      if (data.success === false) {
        throw new Error(data.message || "Authentication failed.");
      }
      return data;
    }

    function saveSession(data, remember) {
      const payload = {
        username: data.username || "",
        token: data.token || "",
        authenticatedAt: Date.now(),
        expiresAt: Number(data.expiresAt || 0),
        remember: Boolean(remember)
      };
      const serialized = JSON.stringify(payload);
      sessionStorage.setItem(SESSION_KEY, serialized);
      if (remember) {
        localStorage.setItem(SESSION_KEY, serialized);
      } else {
        localStorage.removeItem(SESSION_KEY);
      }
    }

    function getStoredSessionRaw() {
      return localStorage.getItem(SESSION_KEY) || sessionStorage.getItem(SESSION_KEY) || "";
    }

    function getRequestedNextUrl() {
      const raw = String(new URLSearchParams(window.location.search).get("next") || "").trim();
      if (!raw) return "";
      try {
        const parsed = new URL(raw);
        if (parsed.origin === CATALOG_ORIGIN) {
          return parsed.toString();
        }
      } catch (error) {}
      return "";
    }

    function buildCatalogHandoffUrl(nextUrl) {
      const rawSession = getStoredSessionRaw();
      if (!nextUrl || !rawSession) return "";
      const encoded = encodeURIComponent(rawSession);
      const delimiter = nextUrl.includes("#") ? "&" : "#";
      return `${nextUrl}${delimiter}gurp_session=${encoded}`;
    }

    function loadStoredSession() {
      const fromLocal = localStorage.getItem(SESSION_KEY);
      if (fromLocal) {
        sessionStorage.setItem(SESSION_KEY, fromLocal);
        return fromLocal;
      }
      return sessionStorage.getItem(SESSION_KEY);
    }

    async function verifyToken(token) {
      const response = await fetch(AUTH_ENDPOINT, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action: "validate", token: token })
      });
      const data = await response.json().catch(() => ({}));
      if (!response.ok || !data.success) {
        throw new Error(data.message || "Session invalid.");
      }
      return data;
    }

    async function tryAutoContinue() {
      const raw = loadStoredSession();
      if (!raw) return;
      try {
        const session = JSON.parse(raw);
        if (!session.token) return;
        await verifyToken(session.token);
        setStatus("Already logged in. Redirecting...", "success");
        const requestedNext = getRequestedNextUrl();
        if (requestedNext) {
          const handoff = buildCatalogHandoffUrl(requestedNext);
          if (handoff) {
            window.location.href = handoff;
            return;
          }
        }
        window.location.href = DOWNLOAD_PATH;
      } catch (error) {
        sessionStorage.removeItem(SESSION_KEY);
        localStorage.removeItem(SESSION_KEY);
      }
    }

    function continueToDownload(data) {
      const requestedNext = getRequestedNextUrl();
      if (requestedNext) {
        const handoff = buildCatalogHandoffUrl(requestedNext);
        if (handoff) {
          window.location.href = handoff;
          return;
        }
      }
      const fallback = data.downloadUrl || DOWNLOAD_PATH;
      window.location.href = fallback;
    }

    function renderTurnstileWidgets() {
      if (!window.turnstile || TURNSTILE_SITE_KEY.indexOf("REPLACE_WITH") !== -1) {
        return;
      }

      if (loginTurnstileId === null) {
        loginTurnstileId = window.turnstile.render("#loginTurnstile", {
          sitekey: TURNSTILE_SITE_KEY,
          theme: "dark"
        });
      }

      if (registerTurnstileId === null) {
        registerTurnstileId = window.turnstile.render("#registerTurnstile", {
          sitekey: TURNSTILE_SITE_KEY,
          theme: "dark"
        });
      }
    }

    function getTurnstileToken(widgetId) {
      if (!window.turnstile || widgetId === null) {
        return "";
      }
      return String(window.turnstile.getResponse(widgetId) || "");
    }

    tabs.forEach((tab) => {
      tab.addEventListener("click", () => activatePanel(tab.dataset.target));
    });

    document.getElementById("loginForm").addEventListener("submit", async (event) => {
      event.preventDefault();
      const form = new FormData(event.target);
      setStatus("Checking login...", "");
      try {
        const turnstileToken = getTurnstileToken(loginTurnstileId);
        if (!turnstileToken) {
          throw new Error("Please complete the verification check.");
        }
        const remember = form.get("remember") === "on";
        const data = await authRequest({
          action: "login",
          username: String(form.get("username") || ""),
          password: String(form.get("password") || ""),
          remember: remember,
          turnstileToken: turnstileToken
        });
        saveSession(data, remember);
        setStatus("Login successful. Redirecting...", "success");
        continueToDownload(data);
      } catch (error) {
        setStatus(error.message, "error");
        if (window.turnstile && loginTurnstileId !== null) {
          window.turnstile.reset(loginTurnstileId);
        }
      }
    });

    document.getElementById("registerForm").addEventListener("submit", async (event) => {
      event.preventDefault();
      const form = new FormData(event.target);
      setStatus("Creating account...", "");
      try {
        const turnstileToken = getTurnstileToken(registerTurnstileId);
        if (!turnstileToken) {
          throw new Error("Please complete the verification check.");
        }
        const remember = form.get("remember") === "on";
        const data = await authRequest({
          action: "register",
          username: String(form.get("username") || ""),
          password: String(form.get("password") || ""),
          license: String(form.get("license") || ""),
          remember: remember,
          turnstileToken: turnstileToken
        });
        saveSession(data, remember);
        setStatus("Registration successful. Redirecting...", "success");
        continueToDownload(data);
      } catch (error) {
        setStatus(error.message, "error");
        if (window.turnstile && registerTurnstileId !== null) {
          window.turnstile.reset(registerTurnstileId);
        }
      }
    });

    window.addEventListener("load", () => {
      if (TURNSTILE_SITE_KEY.indexOf("REPLACE_WITH") !== -1) {
        setStatus("Set TURNSTILE_SITE_KEY in access page to enable verification.", "error");
        return;
      }

      renderTurnstileWidgets();
      tryAutoContinue();
    });
  </script>
  <script src="prefetch.js" defer></script>
  <script src="live-status.js" defer></script>
</body>
</html>
