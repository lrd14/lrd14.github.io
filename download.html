<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <title>gurp - Download</title>
  <meta name="theme-color" content="#97ce5d" />
  <link href="styles.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600;700&display=swap" rel="stylesheet" />
  <link rel="shortcut icon" type="image/x-icon" href="favicon.ico" />
  <meta property="og:title" content="gurp" />
  <meta property="og:description" content="gurp makes Roblox better" />
  <meta property="og:site_name" content="gurp - Download" />
  <meta property="og:type" content="website" />
</head>
<body>
  <header class="site-header">
    <div class="container site-nav">
      <a href="/" class="brand"><img src="logo.png" alt="gurp logo" class="brand-logo" /> gurp</a>
      <nav class="nav-links">
        <a href="https://status.gurp.cc/" class="live-status-chip status-ok" data-live-status>Checking status...</a>
        <a href="/" class="nav-link">Home</a>
        <a href="/features" class="nav-link">Features</a>
        <a href="/tos" class="nav-link">TOS</a>
        <a href="/access" class="btn btn-primary" data-account-btn>Login</a>
      </nav>
    </div>
  </header>

  <main class="section">
    <div class="container">
      <h2>Download gurp</h2>
      <p class="section-intro">
        Your download is ready.
      </p>
      <div class="card">
        <h3>Current Build</h3>
        <p>Version: Stable channel</p>
        <div id="accessStatus" class="status-text">Checking login session...</div>
        <p class="help-text">This link will expire in 10 minutes.</p>
        <div class="cta-row">
          <a href="/access" class="btn btn-primary" id="downloadBtn">Login Required</a>
          <a href="https://discord.gg/UZz5rxRjeM" class="btn btn-secondary">Need Support?</a>
        </div>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <p><span class="footer-brand"><img src="logo.png" alt="gurp logo" /> gurp</span>Always download from official links only.</p>
    </div>
  </footer>
  <script>
    const AUTH_ENDPOINT = "https://gurp-keyauth-gateway.lrd14.workers.dev";
    const SESSION_KEY = "gurp_access_session";
    const statusEl = document.getElementById("accessStatus");
    const downloadBtn = document.getElementById("downloadBtn");

    function setLocked(message) {
      statusEl.textContent = message;
      statusEl.classList.add("error");
      statusEl.classList.remove("success");
      downloadBtn.textContent = "Login Required";
      downloadBtn.href = "/access";
    }

    function setUnlocked(downloadUrl) {
      statusEl.textContent = "Access verified. Latest loader ready.";
      statusEl.classList.remove("error");
      statusEl.classList.add("success");
      downloadBtn.textContent = "Download Loader";
      downloadBtn.href = downloadUrl;
    }

    function isValidWorkerDownloadUrl(downloadUrl) {
      if (!downloadUrl || typeof downloadUrl !== "string") {
        return false;
      }
      try {
        const parsed = new URL(downloadUrl, window.location.origin);
        return parsed.pathname === "/dl" && parsed.searchParams.has("ticket");
      } catch (error) {
        return false;
      }
    }

    async function verifyToken(token) {
      const response = await fetch(AUTH_ENDPOINT, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action: "validate", token: token })
      });
      const data = await response.json().catch(() => ({}));
      if (!response.ok || !data.success) {
        throw new Error(data.message || "Session invalid.");
      }
      return data;
    }

    async function initAccess() {
      const raw = localStorage.getItem(SESSION_KEY) || sessionStorage.getItem(SESSION_KEY);
      if (!raw) {
        setLocked("No active session found. Please login first.");
        return;
      }

      try {
        const session = JSON.parse(raw);
        if (!session.token || !session.authenticatedAt) {
          setLocked("Session token missing. Please login again.");
          return;
        }
        sessionStorage.setItem(SESSION_KEY, raw);
        localStorage.setItem(SESSION_KEY, raw);
        const data = await verifyToken(session.token);
        if (!isValidWorkerDownloadUrl(data.downloadUrl)) {
          setLocked("Download link is outdated. Please redeploy Worker and try again.");
          return;
        }
        setUnlocked(data.downloadUrl);
      } catch (error) {
        sessionStorage.removeItem(SESSION_KEY);
        localStorage.removeItem(SESSION_KEY);
        setLocked(error.message || "Session invalid. Please login again.");
      }
    }

    initAccess();
  </script>
  <script src="live-status.js" defer></script>
</body>
</html>
