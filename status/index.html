<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>gurp Status</title>
  <meta name="theme-color" content="#97ce5d" />
  <meta name="description" content="Live status for gurp systems, authentication, and download delivery." />
  <meta property="og:title" content="gurp" />
  <meta property="og:description" content="gurp makes Roblox better" />
  <meta property="og:site_name" content="gurp Status" />
  <meta property="og:type" content="website" />
  <link rel="stylesheet" href="status.css" />
</head>
<body>
  <main class="container">
    <header class="topbar">
      <a class="brand" href="https://gurp.cc/">gurp</a>
      <a class="back-link" href="https://gurp.cc/">Back to website</a>
    </header>

    <header class="hero">
      <p class="eyebrow">Live Status</p>
      <h1 id="overallTitle">Checking systems...</h1>
      <p id="overallText">Loading current status data.</p>
      <span class="overall-pill" id="overallPill">Loading</span>
    </header>

    <section class="panel services-panel">
      <div class="panel-head">
        <h2>Services</h2>
        <span class="updated-at" id="updatedAt">Updated: --</span>
      </div>
      <div class="services-list" id="services"></div>
    </section>

    <section class="panel incidents-panel">
      <div class="panel-head">
        <h2>Incident History</h2>
      </div>
      <ul class="incidents" id="incidents"></ul>
    </section>

    <section class="panel incidents-panel">
      <div class="panel-head">
        <h2>Recent Status Changes</h2>
      </div>
      <ul class="incidents" id="history"></ul>
    </section>

    <footer class="footer">
      <p>Support: <a href="https://discord.gg/UZz5rxRjeM">Discord</a></p>
      <p class="refresh-meta">
        Last updated: <span id="footerUpdatedAt">--</span>
        <span class="separator">•</span>
        Next refresh in: <span id="nextRefreshIn">60s</span>
      </p>
    </footer>
  </main>

  <script src="../prefetch.js" defer></script>
  <script src="status.js" defer></script>
</body>
</html>
