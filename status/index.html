<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>gurp Status</title>
  <meta name="description" content="Live service status for gurp authentication, download delivery, and website systems." />
  <link rel="stylesheet" href="status.css" />
</head>
<body>
  <main class="wrap">
    <header class="hero">
      <a class="brand" href="https://gurp.cc/">gurp</a>
      <h1>Status</h1>
      <p id="overallText">Checking systems...</p>
      <div class="overall-pill" id="overallPill">Loading</div>
    </header>

    <section class="panel">
      <div class="panel-head">
        <h2>Services</h2>
        <span id="updatedAt">Updated: --</span>
      </div>
      <div id="services" class="grid"></div>
    </section>

    <section class="panel">
      <h2>Incident Notes</h2>
      <ul id="incidents" class="incidents"></ul>
    </section>

    <footer class="footer">
      <p>Need support? Join <a href="https://discord.gg/UZz5rxRjeM">Discord</a>.</p>
    </footer>
  </main>

  <script src="status.js" defer></script>
</body>
</html>
